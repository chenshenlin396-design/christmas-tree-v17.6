<body>
<canvas id="scene" aria-label="紫夜里的星屑圣诞树动画" role="img"></canvas>

<section class="verse">

<script>
(function () {
  "use strict";

  var cvs = document.getElementById("scene");
  var ctx = cvs.getContext("2d", { alpha: false });
  var bloomCvs = document.createElement("canvas");
  var bctx = bloomCvs.getContext("2d");
  var skyCvs = document.createElement("canvas");
  var skyCtx = skyCvs.getContext("2d");

  var W = 0, H = 0, DPR = 1, S = 0, CX = 0, BASEY = 0, mobile = false;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var PNOW = (window.performance && window.performance.now)
    ? function () { return window.performance.now(); }
    : function () { return Date.now(); };

  var state = {
    sway: 0, spin: 0, vel: 0, dragging: false, lastX: 0, moved: 0,
    fire: true, sound: false, t0: PNOW(), last: PNOW(), burstAt: 0
  };

  /* ---------- 光点贴图 ---------- */
  function makeSprite(rgb, soft) {
    var s = document.createElement("canvas");
    s.width = 64; s.height = 64;
    var g = s.getContext("2d");
    var rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    rg.addColorStop(0, "rgba(255,255,255,1)");
    rg.addColorStop(soft, "rgba(" + rgb + ",0.9)");
    rg.addColorStop(1, "rgba(" + rgb + ",0)");
    g.fillStyle = rg;
    g.fillRect(0, 0, 64, 64);
    return s;
  }
  var SP = {
    rose: makeSprite("255,110,180", 0.22),
    violet: makeSprite("182,108,236", 0.26),
    plum: makeSprite("146,64,196", 0.3),
    gold: makeSprite("255,212,152", 0.2),
    white: makeSprite("255,244,250", 0.18)
  };

  function dot(c, img, x, y, r, alpha) {
    if (r <= 0 || alpha <= 0) return;
    c.globalAlpha = alpha > 1 ? 1 : alpha;
    c.drawImage(img, x - r, y - r, r * 2, r * 2);
  }

  /* ---------- 树的粒子几何 ---------- */
  var R = 0.395, TURNS = 7.6;
  var dust = [], beads = [], ring = [], updraft = [];

  function build() {
    dust.length = 0; beads.length = 0; ring.length = 0; updraft.length = 0;
    var nDust = mobile ? 480 : 820;
    var cols = [SP.rose, SP.violet, SP.plum, SP.rose];

    for (var i = 0; i < nDust; i++) {
      var t = Math.pow(Math.random(), 0.62);
      var a = Math.random() * Math.PI * 2;
      var f = 0.5 + Math.random() * 0.5;
      var rr = R * Math.pow(t, 0.93) * f;
      dust.push({
        x: Math.cos(a) * rr, y: 1 - t, z: Math.sin(a) * rr,
        s: 0.75 + Math.random() * 1.75,
        img: cols[Math.floor(Math.random() * cols.length)],
        ph: Math.random() * 6.283, sp: 0.5 + Math.random() * 1.6
      });
    }

    var nBead = mobile ? 430 : 700;
    for (var j = 0; j < nBead; j++) {
      var tb = 0.015 + (j / nBead) * 0.975;
      var ab = tb * TURNS * Math.PI * 2;
      var rb = R * Math.pow(tb, 0.95) + 0.004;
      beads.push({
        x: Math.cos(ab) * rb, y: 1 - tb, z: Math.sin(ab) * rb,
        t: tb, s: 1.25 + Math.random() * 0.55
      });
    }

    var nRing = mobile ? 44 : 66;
    for (var k = 0; k < nRing; k++) {
      var ar = (k / nRing) * Math.PI * 2 + 0.2;
      ring.push({ a: ar, s: 0.9 + Math.random() * 1.1 });
    }

    var nUp = mobile ? 26 : 46;
    for (var q = 0; q < nUp; q++) {
      var ta = Math.random();
      var aa = Math.random() * Math.PI * 2;
      var ra = R * Math.pow(ta, 0.9) * (0.3 + Math.random() * 0.6);
      updraft.push({
        x: Math.cos(aa) * ra, y: 1 - ta, z: Math.sin(aa) * ra,
        vy: 0.02 + Math.random() * 0.05, s: 0.8 + Math.random() * 1.4,
        ph: Math.random() * 6.283
      });
    }
  }

  /* ---------- 夜空底板 ---------- */
  var skyStars = [];
  function buildSky() {
    skyCvs.width = Math.max(1, Math.floor(W * DPR));
    skyCvs.height = Math.max(1, Math.floor(H * DPR));
    skyCtx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var g = skyCtx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#090310");
    g.addColorStop(0.34, "#180a22");
    g.addColorStop(0.56, "#2b0f26");
    g.addColorStop(0.66, "#3d1530");
    g.addColorStop(0.74, "#230b1c");
    g.addColorStop(1, "#120518");
    skyCtx.fillStyle = g;
    skyCtx.fillRect(0, 0, W, H);

    /* 地平线雾光 */
    var haze = skyCtx.createRadialGradient(CX, H * 0.66, 4, CX, H * 0.66, W * 0.7);
    haze.addColorStop(0, "rgba(255,120,190,0.15)");
    haze.addColorStop(0.45, "rgba(150,60,160,0.07)");
    haze.addColorStop(1, "rgba(80,20,90,0)");
    skyCtx.fillStyle = haze;
    skyCtx.fillRect(0, 0, W, H);

    /* 远山剪影 */
    function hills(baseY, amp, color, seed) {
      skyCtx.beginPath();
      skyCtx.moveTo(0, H);
      for (var x = 0; x <= W; x += 8) {
        var y = baseY + Math.sin(x / W * 3.4 + seed) * amp
          + Math.sin(x / W * 11 + seed * 2) * amp * 0.34;
        skyCtx.lineTo(x, y);
      }
      skyCtx.lineTo(W, H);
      skyCtx.closePath();
      skyCtx.fillStyle = color;
      skyCtx.fill();
    }
    hills(H * 0.685, 14, "rgba(28,9,26,0.9)", 0.6);
    hills(H * 0.71, 9, "rgba(14,4,14,0.95)", 2.2);

    /* 星点 */
    skyStars.length = 0;
    var nStar = mobile ? 160 : 260;
    for (var i = 0; i < nStar; i++) {
      var sx = Math.random() * W;
      var sy = Math.random() * H * 0.62;
      var r = 0.25 + Math.random() * 0.8;
      var a = 0.15 + Math.random() * 0.55;
      skyCtx.globalAlpha = a;
      skyCtx.fillStyle = Math.random() > 0.7 ? "#ffd9ec" : "#efe6ff";
      skyCtx.beginPath();
      skyCtx.arc(sx, sy, r, 0, 6.2832);
      skyCtx.fill();
      if (i % 5 === 0) {
        skyStars.push({ x: sx, y: sy, r: r * 1.3, ph: Math.random() * 6.28, sp: 0.6 + Math.random() * 1.2 });
      }
    }
    skyCtx.globalAlpha = 1;
  }

  /* ---------- 烟花 ---------- */
  var fw = [];
  function spawnFirework(x, y) {
    var n = mobile ? 44 : 72;
    var ps = [];
    for (var i = 0; i < n; i++) {
      ps.push({
        a: Math.random() * Math.PI * 2,
        sp: 0.3 + Math.random() * 0.9,
        b: 0.6 + Math.random() * 0.6
      });
    }
    fw.push({
      x: x, y: y, t: 0, life: 1.4 + Math.random() * 0.9,
      whiten: Math.random() > 0.6, ps: ps
    });
  }

  function drawFireworks(c, dt) {
    for (var i = fw.length - 1; i >= 0; i--) {
      var b = fw[i];
      b.t += dt;
      var p = b.t / b.life;
      if (p >= 1) { fw.splice(i, 1); continue; }
      var ease = 1 - Math.pow(1 - p, 2.1);
      var spread = S * 0.44 * ease;
      var fade = Math.pow(1 - p, 1.7);
      var grav = S * 0.1 * p * p;
      for (var j = 0; j < b.ps.length; j++) {
        var q = b.ps[j];
        var dx = Math.cos(q.a) * spread * q.sp;
        var dy = Math.sin(q.a) * spread * q.sp * 0.86 + grav;
        var img = q.b > 1.05 ? SP.white : (b.whiten ? SP.white : SP.rose);
        dot(c, img, b.x + dx, b.y + dy, (1.1 + 1.6 * fade) * (q.b > 1.05 ? 1.15 : 1), fade * 0.85);
      }
      /* 核心闪光 */
      dot(c, SP.white, b.x, b.y, (6 + 14 * fade) * (W > 900 ? 1.1 : 0.8), fade * 0.55);
    }
  }

  /* ---------- 主渲染 ---------- */
  function drawTree(c, t, cosR, sinR) {
    /* 中心光柱 */
    var beam = c.createLinearGradient(0, BASEY - S, 0, BASEY);
    beam.addColorStop(0, "rgba(255,190,230,0)");
    beam.addColorStop(0.3, "rgba(255,150,205,0.08)");
    beam.addColorStop(0.8, "rgba(255,160,210,0.16)");
    beam.addColorStop(1, "rgba(255,205,235,0.05)");
    c.fillStyle = beam;
    c.fillRect(CX - S * 0.07, BASEY - S, S * 0.14, S);

    /* 粒子 */
    for (var i = 0; i < dust.length; i++) {
      var d = dust[i];
      var xr = d.x * cosR - d.z * sinR;
      var zr = d.x * sinR + d.z * cosR;
      var k = 3.0 / (3.0 + zr * 0.85);
      var sx = CX + xr * S * k;
      var sy = BASEY - d.y * S * k;
      if (sx < -20 || sx > W + 20) continue;
      var vis = 0.5 - zr * 1.05;
      if (vis < 0.35) vis = 0.35;
      var tw = 0.55 + 0.45 * Math.sin(t * d.sp + d.ph);
      dot(c, d.img, sx, sy, d.s * k * (1.2 + 0.45 * tw), (0.36 + 0.52 * tw) * vis);
    }

    /* 螺旋光珠 */
    for (var j = 0; j < beads.length; j++) {
      var b = beads[j];
      var bx = b.x * cosR - b.z * sinR;
      var bz = b.x * sinR + b.z * cosR;
      var bk = 3.0 / (3.0 + bz * 0.85);
      var bxs = CX + bx * S * bk;
      var bys = BASEY - b.y * S * bk;
      if (bxs < -20 || bxs > W + 20) continue;
      var bvis = 0.55 - bz * 1.05;
      if (bvis < 0.4) bvis = 0.4;
      var wave = 0.6 + 0.4 * Math.sin(b.t * 34 - t * 4.4);
      dot(c, SP.gold, bxs, bys, b.s * bk * 1.7, (0.35 + 0.6 * wave) * bvis);
      dot(c, SP.white, bxs, bys, b.s * bk * 0.55, 0.55 * wave * bvis);
    }

    /* 底座星环 */
    for (var m = 0; m < ring.length; m++) {
      var r = ring[m];
      var rx = Math.cos(r.a);
      var rz = Math.sin(r.a);
      var rxs = CX + (rx * cosR - rz * sinR) * R * S;
      var rys = BASEY + (rx * sinR + rz * cosR) * R * S * 0.16 - 2;
      var rw = 0.35 + 0.65 * Math.pow(Math.max(0, Math.sin(t * 1.4 + r.a * 1.4)), 2);
      dot(c, SP.gold, rxs, rys, r.s * 2.6, 0.5 * rw);
    }

    /* 上升的星屑 */
    for (var u = 0; u < updraft.length; u++) {
      var up = updraft[u];
      var uy = up.y + (t * up.vy * 4) % 1.2;
      if (uy > 1.15) uy = uy - 1.2;
      var uxr = up.x * cosR - up.z * sinR;
      var uzr = up.x * sinR + up.z * cosR;
      var uk = 3.0 / (3.0 + uzr * 0.85);
      var uxs = CX + uxr * S * uk;
      var uys = BASEY - uy * S * uk;
      var ua = 0.25 + 0.55 * Math.pow(Math.max(0, Math.sin(t * 1.2 + up.ph)), 2);
      dot(c, SP.white, uxs, uys, up.s * 1.5, ua * 0.7);
    }
  }

  function drawGround(c, t) {
    c.save();
    c.translate(CX, BASEY + 8);
    c.scale(1, 0.3);
    var g = c.createRadialGradient(0, 0, 2, 0, 0, S * 0.55);
    g.addColorStop(0, "rgba(255,235,242,0.6)");
    g.addColorStop(0.22, "rgba(255,170,212,0.26)");
    g.addColorStop(0.6, "rgba(220,110,190,0.07)");
    g.addColorStop(1, "rgba(200,90,180,0)");
    c.fillStyle = g;
    c.beginPath();
    c.arc(0, 0, S * 0.55, 0, 6.2832);
    c.fill();
    c.restore();
  }

  function drawStar(c, t) {
    var x = CX, y = BASEY - S * 1.02;
    var pulse = 0.94 + 0.06 * Math.sin(t * 2.2);
    var rs = S * 0.042 * pulse;

    var halo = c.createRadialGradient(x, y, 1, x, y, rs * 5);
    halo.addColorStop(0, "rgba(255,238,246,0.75)");
    halo.addColorStop(0.28, "rgba(255,170,210,0.22)");
    halo.addColorStop(1, "rgba(255,140,195,0)");
    c.fillStyle = halo;
    c.beginPath();
    c.arc(x, y, rs * 5, 0, 6.2832);
    c.fill();

    for (var i = 0; i < 4; i++) {
      var ang = i * Math.PI / 2 + Math.sin(t * 0.3) * 0.04;
      var len = rs * (i % 2 === 0 ? 2.6 : 1.2);
      var wid = rs * 0.12;
      var dx = Math.cos(ang), dy = Math.sin(ang);
      c.fillStyle = "rgba(255,250,253,0.92)";
      c.beginPath();
      c.moveTo(x + dx * len, y + dy * len);
      c.lineTo(x - dy * wid, y + dx * wid);
      c.lineTo(x + dy * wid, y - dx * wid);
      c.closePath();
      c.fill();
    }

    /* 横向镜头光带 */
    var lg = c.createLinearGradient(x - S * 0.34, 0, x + S * 0.34, 0);
    lg.addColorStop(0, "rgba(255,230,242,0)");
    lg.addColorStop(0.42, "rgba(255,235,246,0.32)");
    lg.addColorStop(0.5, "rgba(255,250,252,0.72)");
    lg.addColorStop(0.58, "rgba(255,235,246,0.32)");
    lg.addColorStop(1, "rgba(255,230,242,0)");
    c.fillStyle = lg;
    c.fillRect(x - S * 0.34, y - 0.9, S * 0.68, 1.8);

    dot(c, SP.white, x, y, rs * 0.4, 0.95);
  }

  function frame(now) {
    var t = (now - state.t0) / 1000;
    var dt = (now - state.last) / 1000;
    if (!isFinite(dt) || dt <= 0) dt = 0.016;
    if (dt > 0.06) dt = 0.06;
    state.last = now;

    if (!state.dragging && !reduced) {
      state.spin += state.vel * dt;
      state.vel *= Math.exp(-dt * 3);
      if (Math.abs(state.vel) < 0.0008) state.vel = 0;
      state.sway = Math.sin(t * 0.16) * 0.09;
    }
    var rot = state.sway + state.spin + 0.55;
    var cosR = Math.cos(rot), sinR = Math.sin(rot);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.drawImage(skyCvs, 0, 0, W, H);

    /* 微亮星点闪烁 */
    ctx.globalCompositeOperation = "lighter";
    for (var s = 0; s < skyStars.length; s++) {
      var st = skyStars[s];
      var a = 0.12 + 0.5 * Math.pow(Math.max(0, Math.sin(t * st.sp + st.ph)), 3);
      dot(ctx, SP.white, st.x, st.y, st.r * 2.2, a);
    }

    drawGround(ctx, t);
    drawTree(ctx, t, cosR, sinR);
    drawStar(ctx, t);

    if (state.fire && t - state.burstAt > 2.6) {
      state.burstAt = t;
      var n = Math.random() > 0.5 ? 2 : 1;
      for (var f = 0; f < n; f++) {
        spawnFirework(
          W * (0.08 + Math.random() * 0.36),
          H * (0.1 + Math.random() * 0.26)
        );
      }
    }
    drawFireworks(ctx, dt);

    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;

    /* 辉光 */
    var bw = Math.max(1, Math.floor(W * 0.45)), bh = Math.max(1, Math.floor(H * 0.45));
    if (bloomCvs.width !== bw || bloomCvs.height !== bh) {
      bloomCvs.width = bw;
      bloomCvs.height = bh;
    }
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    bctx.clearRect(0, 0, bw, bh);
    try { bctx.filter = "blur(7px)"; } catch (e) {}
    bctx.drawImage(cvs, 0, 0, bw, bh);
    try { bctx.filter = "none"; } catch (e2) {}

    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.55;
    ctx.drawImage(bloomCvs, 0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function loop(now) {
    frame(now);
    if (!reduced) window.requestAnimationFrame(loop);
  }

  /* ---------- 声音 ---------- */
  var actx = null;
  function chime() {
    if (!state.sound) return;
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state === "suspended") actx.resume();
      var t0 = actx.currentTime;
      var notes = [659.25, 880.0, 1174.66];
      for (var i = 0; i < notes.length; i++) {
        var o = actx.createOscillator();
        var g = actx.createGain();
        o.type = "sine";
        o.frequency.value = notes[i];
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(i === 0 ? 0.22 : 0.12, t0 + 0.03 + i * 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.1 + i * 0.2);
        o.connect(g);
        g.connect(actx.destination);
        o.start(t0);
        o.stop(t0 + 1.4 + i * 0.2);
      }
    } catch (err) {}
  }

  /* ---------- 交互 ---------- */
  cvs.addEventListener("pointerdown", function (e) {
    state.dragging = true;
    state.lastX = e.clientX;
    state.moved = 0;
    state.vel = 0;
    try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  });

  cvs.addEventListener("pointermove", function (e) {
    if (!state.dragging) return;
    var dx = e.clientX - state.lastX;
    state.lastX = e.clientX;
    state.spin += dx * 0.006;
    state.vel = dx * 0.006 * 60;
    if (state.vel > 3) state.vel = 3;
    if (state.vel < -3) state.vel = -3;
    state.moved += Math.abs(dx);
  });

  function endDrag(e) {
    if (!state.dragging) return;
    state.dragging = false;
    try { cvs.releasePointerCapture(e.pointerId); } catch (err) {}
    if (state.moved < 8) {
      spawnFirework(e.clientX, Math.min(H * 0.55, e.clientY));
      state.burstAt = (PNOW() - state.t0) / 1000;
      chime();
    }
  }
  cvs.addEventListener("pointerup", endDrag);
  cvs.addEventListener("pointercancel", function () { state.dragging = false; });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") state.spin -= 0.1;
    if (e.key === "ArrowRight") state.spin += 0.1;
  });

  var btnFire = document.getElementById("btn-fire");
  var btnSound = document.getElementById("btn-sound");
  var btnFull = document.getElementById("btn-full");

  btnFire.addEventListener("click", function () {
    state.fire = !state.fire;
    btnFire.setAttribute("aria-pressed", state.fire ? "true" : "false");
  });

  btnSound.addEventListener("click", function () {
    state.sound = !state.sound;
    btnSound.setAttribute("aria-pressed", state.sound ? "true" : "false");
    if (state.sound) chime();
  });

  btnFull.addEventListener("click", function () {
    var doc = document, el = doc.documentElement;
    var fsEl = doc.fullscreenElement || doc.webkitFullscreenElement;
    try {
      if (!fsEl) {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      } else {
        (doc.exitFullscreen || doc.webkitExitFullscreen).call(doc);
      }
    } catch (err) {}
  });

  document.addEventListener("fullscreenchange", function () {
    btnFull.setAttribute("aria-pressed", document.fullscreenElement ? "true" : "false");
  });

  /* ---------- 尺寸 ---------- */
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 1.6);
    mobile = W < 820;
    cvs.width = Math.floor(W * DPR);
    cvs.height = Math.floor(H * DPR);
    if (mobile) {
      CX = W * 0.5;
      BASEY = H * 0.62;
      S = Math.min(H * 0.46, W * 1.0);
    } else {
      CX = W * 0.34;
      BASEY = H * 0.8;
      S = Math.min(H * 0.68, W * 0.62);
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildSky();
  }

  var rt = null;
  window.addEventListener("resize", function () {
    if (rt) window.clearTimeout(rt);
    rt = window.setTimeout(function () {
      resize();
      build();
      if (reduced) frame(PNOW());
    }, 160);
  });

  /* ---------- 启动 ---------- */
  resize();
  build();
  state.last = PNOW();
  if (reduced) {
    state.t0 -= 500;
    frame(PNOW());
  } else {
    window.requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
